<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <title>Room sources are found by area</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="360" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#111827">Sources are found by area – nothing to configure per sensor</text>

  <rect x="24" y="60" width="330" height="258" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="40" y="86" font-weight="600" fill="#374151">Home Assistant area “Office”</text>
  <rect x="44" y="104" width="290" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="58" y="128" fill="#1e3a8a" font-weight="600">Temperature sensors</text>
  <text x="58" y="148" fill="#1e3a8a" font-size="13">any integration, any number</text>
  <rect x="44" y="172" width="290" height="56" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="58" y="196" fill="#14532d" font-weight="600">Window and door contacts</text>
  <text x="58" y="216" fill="#14532d" font-size="13">window / opening / door sensors</text>
  <rect x="44" y="240" width="290" height="70" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="58" y="264" fill="#7c2d12" font-weight="600">Danfoss Ally valves (ZHA)</text>
  <text x="58" y="284" fill="#7c2d12" font-size="13">found by device, not by name</text>
  <text x="58" y="300" fill="#7c2d12" font-size="13">own sensor of a valve is never a source</text>

  <path d="M334 132H420" stroke="#4b5563" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <path d="M334 200H420" stroke="#4b5563" stroke-width="2" marker-end="url(#a)" fill="none"/>

  <rect x="424" y="96" width="190" height="150" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="519" y="126" text-anchor="middle" font-weight="600" fill="#111827">Coordinator</text>
  <text x="519" y="154" text-anchor="middle" fill="#374151" font-size="14">Median of fresh</text>
  <text x="519" y="174" text-anchor="middle" fill="#374151" font-size="14">temperatures</text>
  <text x="519" y="204" text-anchor="middle" fill="#374151" font-size="14">Any open contact</text>
  <text x="519" y="224" text-anchor="middle" fill="#374151" font-size="14">= window open</text>

  <path d="M614 150H700" stroke="#4b5563" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <path d="M614 200H700" stroke="#4b5563" stroke-width="2" marker-end="url(#a)" fill="none"/>

  <rect x="704" y="110" width="172" height="120" rx="10" fill="#ffedd5" stroke="#f97316"/>
  <text x="790" y="140" text-anchor="middle" font-weight="600" fill="#7c2d12">Every valve</text>
  <text x="790" y="168" text-anchor="middle" fill="#7c2d12" font-size="14">gets the room</text>
  <text x="790" y="188" text-anchor="middle" fill="#7c2d12" font-size="14">temperature and</text>
  <text x="790" y="208" text-anchor="middle" fill="#7c2d12" font-size="14">the window state</text>

  <text x="450" y="344" text-anchor="middle" fill="#6b7280" font-size="13">Switch single sources off per room in the room device; the area decides which room they belong to.</text>
</svg>
